<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Arena Pro | Real-time Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom App-wide Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #262626; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #404040; 
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse-highlight {
            0%, 100% { background-color: rgba(245, 158, 11, 0.0); }
            50% { background-color: rgba(245, 158, 11, 0.15); }
        }

        .live-pulse-row {
            animation: pulse-highlight 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans tracking-wide">

                <div class="flex space-x-1 bg-neutral-950 p-1 rounded-xl border border-neutral-850 overflow-x-auto max-w-full">

        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <section id="live-scores-section" class="space-y-6">

                <div>
                    <h2 class="text-2xl font-black flex items-center gap-2">
                        <span class="flex h-2.5 w-2.5 relative">

                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-600"></span>
                        </span>
                        Live Match Center
                    </h2>
                </div>
                <div class="bg-neutral-900 border border-neutral-850 px-3 py-1.5 rounded-lg text-xs font-mono text-amber-400" id="live-ticker">
                    SYNCING STREAM CLOCK...
                </div>
            </div>
            
            <div id="live-score-container" class="grid grid-cols-1 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="table-section" class="space-y-6 hidden">
            <div class="border-b border-neutral-850 pb-4">
                <h2 class="text-2xl font-black flex items-center gap-2">
                    <i class="fa-solid fa-list-ol text-amber-500"></i>
                    Tournament Match Matrix
                </h2>
                <p class="text-xs text-neutral-400 mt-1">Full breakdown ledger of past results and scheduled playoff lineups.</p>
            </div>
            
            <div class="bg-neutral-900 border border-neutral-850 rounded-xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">

                                <th class="p-4">Innings 2</th>

                            </tr>
                        </thead>
                        <tbody id="match-table-body" class="divide-y divide-neutral-850"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="highlights-section" class="space-y-6 hidden">
            <div class="border-b border-neutral-850 pb-4">
                <h2 class="text-2xl font-black flex items-center gap-2">
                    <i class="fa-solid fa-play text-orange-500"></i>

            </div>
            <div id="highlights-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>
